<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodbe · Games</title>
<meta name="description" content="Rodbe, mobile game developer. Date Harvest (حصاد التمر).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #faf6ef; --card: #ffffff; --text: #2b2118; --muted: #6f5f50; --accent: #b07a1f; --line: #eadfcd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17120d; --card: #211a13; --text: #f3eadf; --muted: #b9a891; --accent: #e0aa48; --line: #3a2f24; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Baloo Bhaijaan 2", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { font-size: 36px; margin: 0; }
  .tag { color: var(--muted); margin: 4px 0 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; }
  .card h2 { margin: 0; font-size: 24px; line-height: 1.4; }
  .card .pkg { color: var(--muted); font-size: 14px; margin: 2px 0 16px; }
  .card a {
    display: inline-block; color: var(--accent); font-weight: 700; text-decoration: none;
    border: 1.5px solid var(--accent); border-radius: 999px; padding: 6px 20px;
  }
  .card a:hover { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rodbe</h1>
  <p class="tag">Mobile games · ألعاب جوال</p>
  <div class="card">
    <h2><span lang="ar" dir="rtl">حصاد التمر</span> · Date Harvest</h2>
    <p class="pkg">com.rodbe.hasadaltamr</p>
    <a href="hasad-altamr/privacy.html">Privacy Policy · <span lang="ar" dir="rtl">سياسة الخصوصية</span></a>
  </div>
</div>
</body>
</html>
